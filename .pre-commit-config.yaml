# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      # Mode must be exactly 0755, not whatever `chmod +x` yields: under a 002
      # umask it produces 0775, which the playbook then rewrites to 0755 in
      # $HOME on every run. Git only records 100755/100644, so the group bit
      # has to be normalized here.
      - id: make-zshrc-scripts-executable
        name: Make .zshrc.d scripts executable (0755)
        entry: find roles/mac_dev_playbook/files/HOME/.zshrc.d -type f -name "*.zsh" -exec chmod 755 {} +
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.2.0
    hooks:
      - id: detect-secrets
  - repo: https://github.com/ansible-community/ansible-lint
    rev: v25.12.2
    hooks:
      - id: ansible-lint
