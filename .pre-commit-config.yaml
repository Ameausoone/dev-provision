# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      # Shebang scripts get +x, and every file gets its group/other write bits
      # stripped: `chmod +x` under a 002 umask yields 0775, which the dotfiles
      # sync copies verbatim to $HOME where the playbook forces 0755 -- the
      # file would flip-flop on every run. Git only records 100755/100644, so
      # the group bit has to be normalized here.
      - id: normalize-file-modes
        name: normalize file modes (0755 for shebang scripts, 0644 otherwise)
        entry: bash -c 'for f in "$@"; do head -1 "$f" | grep -q "^#!" && chmod +x "$f"; chmod go-w "$f"; done' --
        language: system
        types: [file]
        pass_filenames: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.2.0
    hooks:
      - id: detect-secrets
  - repo: https://github.com/ansible-community/ansible-lint
    rev: v25.12.2
    hooks:
      - id: ansible-lint
