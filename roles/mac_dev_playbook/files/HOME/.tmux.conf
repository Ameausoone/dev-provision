# True color, needed by starship/bat/neovim under Ghostty.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# Windows/panes numbered from 1, renumbered on close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New panes/windows open in the current pane's directory.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "reloaded"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-style "bg=default fg=colour245"
set -g status-left "#[fg=colour110]#S #[default]"
set -g status-right "#[fg=colour245]%H:%M"
setw -g window-status-current-style "fg=colour110 bold"
