[settings]
experimental = true
idiomatic_version_file_enable_tools = []

[settings.python]
compile = false

[tools]
claude-code = "latest"      # Claude Code CLI tool
cookiecutter = "latest"     # Cookiecutter is a command-line utility that creates projects from project templates
devcontainer-cli = "latest" # devcontainers is a command line tool for managing devcontainers
fnox = "latest"             # Secret cli injector https://fnox.jdx.dev/
"pipx:gita" = "latest"      # gita manages many git repos at once, no Homebrew formula exists
#gcloud = "548"              # Google Cloud CLI
#golang = "1"                # Go programming language
helm = "4.2.4"                  # Kubernetes package manager
hugo = "0"                  # Static site generator
java = "temurin-24"         # Eclipse Temurin JDK
kubectl = "1"               # Kubernetes command-line tool
maven = "3"                 # Java build automation tool
opentofu = "1.12"           # Open-source Terraform fork
pre-commit = "4"            # Git hooks framework
shfmt = "3"                 # Shell formatter
terraform = "1.15"          # Infrastructure as Code tool
terraform-docs = "0"        # Generate documentation from Terraform modules
tf-summarize = "latest"         # Tool to summarize Terraform plans
tflint = "0"                # Terraform linter
uv = "0"                    # Fast Python package installer
watchexec= "latest"         # Run commands when files change
