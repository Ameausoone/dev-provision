"$schema" = 'https://starship.rs/config-schema.json'

# Left prompt: directory + git info
format = """
$directory$git_branch${custom.github_pr}$git_status
$character"""

# Right prompt: runtime context (non-intrusive, right-aligned)
right_format = """$status$cmd_duration$jobs$python$golang$kubernetes${custom.aws_danger}$aws$terraform$gcloud$battery"""

[directory]
truncation_length = 4      # max path segments to show
truncate_to_repo = true    # truncate to repo root when inside a git repo
style = "bold blue"

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold purple"
truncation_length = 32     # truncate long branch names
truncation_symbol = "…"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
ahead = ">"        # local is ahead of remote
behind = "<"       # local is behind remote
diverged = "<>"    # diverged from remote
conflicted = "~"   # merge conflicts present
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[character]
success_symbol = "[>](bold green)"   # prompt char on success
error_symbol = "[>](bold red)"       # prompt char on error
vimcmd_symbol = "[<](bold green)"    # prompt char in vim normal mode

[status]
disabled = false
format = "[$status]($style) "
style = "bold red"    # make non-zero exit codes visually prominent

[cmd_duration]
min_time = 3_000      # only show duration for commands taking 3s+
format = "[$duration]($style) "

[jobs]
format = "[$number]($style) "   # show count of background jobs

[python]
# show version + virtualenv name when active, version only otherwise
format = '[$version( \($virtualenv\))]($style) '
style = "bold yellow"

[golang]
# only shown inside Go projects (detected via go.mod, *.go, etc.)
format = "[$version]($style) "
style = "bold cyan"

[kubernetes]
disabled = false
format = "[$context]($style) "
style = "bold blue"

# https://starship.rs/config/#kubernetes
# Shorten well-known context names and colour them by blast radius. Rules are
# evaluated in order, first match wins -- the preprod/staging rule must stay
# first, otherwise ".*prod.*" would swallow "preprod" and paint it red.
[[kubernetes.contexts]]
context_pattern = ".*(preprod|staging).*"
context_alias = "stg"
style = "bold yellow"

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
context_alias = "prod"
style = "bold red"

[aws]
# https://starship.rs/config/#aws
# force_display: with an SSO-only setup there is no ~/.aws/credentials and no
# AWS_ACCESS_KEY_ID, so starship never "detects" credentials and stays silent.
# The outer ( ) drops the module entirely when AWS_PROFILE is unset -- without
# it, force_display prints the region of the default profile on every prompt.
force_display = true
format = "([$profile]($style) )"
style = "bold yellow"
expiration_symbol = " !"   # appended when the cached token has expired

[terraform]
# shows current workspace (default = "default")
format = "[$workspace]($style) "
style = "bold purple"

[gcloud]
# only show project to keep it short (account/domain are usually implicit)
format = "[$project]($style) "
style = "bold blue"

[battery]
disabled = true

[[battery.display]]
threshold = 30     # only show battery when below 30%
style = "bold red"

# The [aws] module has no per-profile styling, so a red badge carries the warning
# instead. Matches "<something>-prod" but not "-preprod" (which ends in "eprod").
[custom.aws_danger]
shell = ["sh"]
when = 'case "$AWS_PROFILE" in *-prod) exit 0;; esac; exit 1'
command = "echo PROD"
format = "[$output]($style) "
style = "bold white bg:red"

# Shows [#N] linking to the open PR, or branch name linking to GitHub if no PR.
# Cache: ~/.starship/github_pr_cache/ — async fork, atomic writes, flock.
# shell must not carry "-c": starship feeds the command on the shell's stdin, so
# a trailing "-c" consumes nothing and the shell exits 2 before running anything.
[custom.github_pr]
command = "python3 ~/.starship/github_pr.py"
when = "git remote get-url origin 2>/dev/null | grep -q github.com"
shell = ["bash"]
format = "$output "
unsafe_no_escape = true
