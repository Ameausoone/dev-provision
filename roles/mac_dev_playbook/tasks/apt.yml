---
# claude-desktop's postinst registers the same repo as the deb822 entry below,
# under its own keyring path -- and apt hard-fails on a source declared twice
# with two Signed-By paths. These two tasks come first because that failure
# breaks every apt call, not just the one installing claude-desktop.
- name: Opt claude-desktop out of registering its own apt source
  ansible.builtin.copy:
    dest: /etc/default/claude-desktop
    content: |
      # Repo registration is owned by the deb822 entry this playbook manages.
      CLAUDE_DESKTOP_ADD_REPO="false"
    mode: "0644"
  become: true

# Opting out only stops the postinst from rewriting the file, it never removes
# one left by an earlier install.
- name: Remove the apt source registered by claude-desktop
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/claude-desktop.list
    state: absent
  become: true

# Same story as claude-desktop above: google-chrome-stable's postinst writes
# /etc/apt/sources.list.d/google-chrome.list, which collides with the deb822
# entry this playbook manages. repo_add_once is the documented opt-out, read by
# the postinst from /etc/default/google-chrome.
- name: Opt google-chrome out of registering its own apt source
  ansible.builtin.copy:
    dest: /etc/default/google-chrome
    content: |
      # Repo registration is owned by the deb822 entry this playbook manages.
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"
    mode: "0644"
  become: true

- name: Remove the apt source registered by google-chrome
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/google-chrome.list
    state: absent
  become: true

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ mac_dev_playbook_apt_packages }}"
    state: present
  become: true

- name: Add apt repositories (deb822 format)
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: deb
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components | default(omit) }}"
    architectures: "{{ item.architectures | default(omit) }}"
    signed_by: "{{ item.signed_by }}"
  become: true
  loop: "{{ mac_dev_playbook_apt_repo_packages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install apt-repo-backed packages
  ansible.builtin.apt:
    name: "{{ item.name }}"
    state: present
  become: true
  loop: "{{ mac_dev_playbook_apt_repo_packages }}"
  loop_control:
    label: "{{ item.name }}"

# Unauthenticated, so subject to GitHub's 60 requests/hour limit -- one request
# per entry, on every run.
- name: Resolve the latest release of GitHub-published .deb packages
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ item.repo }}/releases/latest"
  register: mac_dev_playbook_deb_github_releases
  loop: "{{ mac_dev_playbook_apt_deb_github_packages }}"
  loop_control:
    label: "{{ item.name }}"

# Appending rather than handling them separately: from here on the cache,
# download and install tasks treat both kinds of .deb the same way.
- name: Add the resolved .deb URLs to the install list
  ansible.builtin.set_fact:
    mac_dev_playbook_apt_deb_packages: "{{ mac_dev_playbook_apt_deb_packages + [{
      'name': item.item.name,
      'description': item.item.description,
      'url': (item.json.assets
              | selectattr('name', 'match', item.item.asset_regex)
              | map(attribute='browser_download_url')
              | first),
    }] }}"
  loop: "{{ mac_dev_playbook_deb_github_releases.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Create .deb cache directory
  ansible.builtin.file:
    path: "{{ mac_dev_playbook_deb_cache_dir }}"
    state: directory
    mode: "0755"

- name: Find cached .deb packages still within the max age
  ansible.builtin.find:
    paths: "{{ mac_dev_playbook_deb_cache_dir }}"
    patterns: "*.deb"
    age: "-{{ mac_dev_playbook_deb_cache_max_age }}"
  register: mac_dev_playbook_deb_cache_fresh

- name: Download .deb packages missing from or stale in the cache
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ mac_dev_playbook_deb_cache_dir }}/{{ item.name }}.deb"
    mode: "0644"
    force: true
  loop: "{{ mac_dev_playbook_apt_deb_packages }}"
  loop_control:
    label: "{{ item.name }}"
  when: mac_dev_playbook_deb_cache_dir ~ '/' ~ item.name ~ '.deb'
        not in mac_dev_playbook_deb_cache_fresh.files | map(attribute='path')
  register: mac_dev_playbook_deb_download

# get_url leaves the file untouched when the release has not moved, so its mtime
# would stay stale and trigger a re-download on every subsequent run.
- name: Restart the cache countdown of .deb packages that were already current
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: touch
    mode: "0644"
  loop: "{{ mac_dev_playbook_deb_download.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.skipped | default(false)) and not item.changed
  changed_when: false

- name: Install cached .deb packages
  ansible.builtin.apt:
    deb: "{{ mac_dev_playbook_deb_cache_dir }}/{{ item.name }}.deb"
  become: true
  loop: "{{ mac_dev_playbook_apt_deb_packages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create local fonts directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Check for existing Nerd Font
  ansible.builtin.find:
    paths: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    patterns: "{{ mac_dev_playbook_nerd_font_name }}*"
  register: mac_dev_playbook_nerd_font_installed
  no_log: true

- name: Download Nerd Font archive
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ mac_dev_playbook_nerd_font_name }}.zip"
    dest: "/tmp/{{ mac_dev_playbook_nerd_font_name }}-nerd-font.zip"
    mode: "0644"
  when: mac_dev_playbook_nerd_font_installed.matched == 0

- name: Unpack Nerd Font archive into local fonts directory
  ansible.builtin.unarchive:
    src: "/tmp/{{ mac_dev_playbook_nerd_font_name }}-nerd-font.zip"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    remote_src: true
  when: mac_dev_playbook_nerd_font_installed.matched == 0

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f "{{ ansible_facts.env.HOME }}/.local/share/fonts"
  changed_when: true
  when: mac_dev_playbook_nerd_font_installed.matched == 0
