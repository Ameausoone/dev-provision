---
- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ mac_dev_playbook_apt_packages }}"
    state: present
  become: true

- name: Add apt repositories (deb822 format)
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: deb
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components | default(omit) }}"
    architectures: "{{ item.architectures | default(omit) }}"
    signed_by: "{{ item.signed_by }}"
  become: true
  loop: "{{ mac_dev_playbook_apt_repo_packages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install apt-repo-backed packages
  ansible.builtin.apt:
    name: "{{ item.name }}"
    state: present
  become: true
  loop: "{{ mac_dev_playbook_apt_repo_packages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create .deb cache directory
  ansible.builtin.file:
    path: "{{ mac_dev_playbook_deb_cache_dir }}"
    state: directory
    mode: "0755"

- name: Find cached .deb packages still within the max age
  ansible.builtin.find:
    paths: "{{ mac_dev_playbook_deb_cache_dir }}"
    patterns: "*.deb"
    age: "-{{ mac_dev_playbook_deb_cache_max_age }}"
  register: mac_dev_playbook_deb_cache_fresh

- name: Download .deb packages missing from or stale in the cache
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ mac_dev_playbook_deb_cache_dir }}/{{ item.name }}.deb"
    mode: "0644"
    force: true
  loop: "{{ mac_dev_playbook_apt_deb_packages }}"
  loop_control:
    label: "{{ item.name }}"
  when: mac_dev_playbook_deb_cache_dir ~ '/' ~ item.name ~ '.deb'
        not in mac_dev_playbook_deb_cache_fresh.files | map(attribute='path')
  register: mac_dev_playbook_deb_download

# get_url leaves the file untouched when the release has not moved, so its mtime
# would stay stale and trigger a re-download on every subsequent run.
- name: Restart the cache countdown of .deb packages that were already current
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: touch
    mode: "0644"
  loop: "{{ mac_dev_playbook_deb_download.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.skipped | default(false)) and not item.changed
  changed_when: false

- name: Install cached .deb packages
  ansible.builtin.apt:
    deb: "{{ mac_dev_playbook_deb_cache_dir }}/{{ item.name }}.deb"
  become: true
  loop: "{{ mac_dev_playbook_apt_deb_packages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create local fonts directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Check for existing Nerd Font
  ansible.builtin.find:
    paths: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    patterns: "{{ mac_dev_playbook_nerd_font_name }}*"
  register: mac_dev_playbook_nerd_font_installed
  no_log: true

- name: Download Nerd Font archive
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ mac_dev_playbook_nerd_font_name }}.zip"
    dest: "/tmp/{{ mac_dev_playbook_nerd_font_name }}-nerd-font.zip"
    mode: "0644"
  when: mac_dev_playbook_nerd_font_installed.matched == 0

- name: Unpack Nerd Font archive into local fonts directory
  ansible.builtin.unarchive:
    src: "/tmp/{{ mac_dev_playbook_nerd_font_name }}-nerd-font.zip"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    remote_src: true
  when: mac_dev_playbook_nerd_font_installed.matched == 0

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f "{{ ansible_facts.env.HOME }}/.local/share/fonts"
  changed_when: true
  when: mac_dev_playbook_nerd_font_installed.matched == 0
