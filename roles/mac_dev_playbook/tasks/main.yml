---
- name: Determine Homebrew prefix
  ansible.builtin.set_fact:
    mac_dev_playbook_brew_prefix: "{{ lookup('pipe', 'brew --prefix') }}"

- name: Set up oh-my-zsh
  ansible.builtin.import_tasks: oh-my-zsh.yml

- name: Provision dotfiles
  ansible.builtin.import_tasks: dotfiles.yml

- name: Provision Homebrew packages
  ansible.builtin.import_tasks: brew.yml
  tags:
    - brew

- name: Install mise-managed tools
  ansible.builtin.import_tasks: mise.yml
  tags:
    - mise

- name: Provision apt packages (Ubuntu)
  ansible.builtin.import_tasks: apt.yml
  tags:
    - apt
  when: ansible_facts.os_family == 'Debian'
  vars:
    # ansible.builtin.apt/deb822_repository need python3-apt/python3-debian,
    # which only exist for the system Python (not the mise-managed one from
    # interpreter_python in ansible.cfg).
    ansible_python_interpreter: /usr/bin/python3

- name: Provision Flatpak apps (Ubuntu)
  ansible.builtin.import_tasks: flatpak.yml
  tags:
    - flatpak
  when: ansible_facts.os_family == 'Debian'

- name: Provision snap packages (Ubuntu)
  ansible.builtin.import_tasks: snap.yml
  tags:
    - snap
  when: ansible_facts.os_family == 'Debian'

- name: Configure Docker CLI plugins
  ansible.builtin.import_tasks: docker.yml

- name: Install GitHub CLI extensions
  ansible.builtin.import_tasks: github.yml

- name: Configure shells
  ansible.builtin.import_tasks: shells.yml
  tags:
    - shells

- name: Apply macOS system defaults
  ansible.builtin.import_tasks: osx.yml
  tags:
    - osx
  when: ansible_facts.os_family == 'Darwin'
