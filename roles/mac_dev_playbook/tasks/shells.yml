---
- name: Register zsh and bash in /etc/shells (macOS)
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ item }}"
    state: present
  become: true
  with_items:
    - "/bin/zsh"
    - "/usr/local/bin/bash"
  when: ansible_facts['os_family'] == 'Darwin'

- name: Set zsh as default shell (macOS)
  ansible.builtin.command: chsh -s /bin/zsh
  become: true
  changed_when: false
  when: ansible_facts['os_family'] == 'Darwin'

- name: Register Linuxbrew zsh in /etc/shells (Ubuntu)
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ mac_dev_playbook_brew_prefix }}/bin/zsh"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Set zsh as default shell (Ubuntu)
  ansible.builtin.command: "chsh -s {{ mac_dev_playbook_brew_prefix }}/bin/zsh {{ ansible_facts.env.USER }}"
  become: true
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'
