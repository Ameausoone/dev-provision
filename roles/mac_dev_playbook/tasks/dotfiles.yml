---
# tasks file for mac-dev-playbook

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  # become: true
  with_items:
    - "{{ ansible_facts.env.HOME }}/.ansible"
    - "{{ ansible_facts.env.HOME }}/.zshrc.d"
    - "{{ ansible_facts.env.HOME }}/.terraform.d/plugin-cache"
    - "{{ ansible_facts.env.HOME }}/.config"
    - "{{ ansible_facts.env.HOME }}/.config/ghostty"

- name: Find managed directories
  ansible.builtin.find:
    paths: "{{ role_path }}/files/HOME"
    patterns: ".managed-by-ansible"
    recurse: true
    file_type: file
    hidden: true
  register: mac_dev_playbook_managed_markers
  tags:
    - dotfiles

- name: Set managed directories list
  ansible.builtin.set_fact:
    mac_dev_playbook_managed_dirs: >-
      {{ mac_dev_playbook_managed_markers.files
         | map(attribute='path')
         | map('dirname')
         | map('regex_replace', '^' + role_path + '/files/HOME/', '')
         | list }}
  tags:
    - dotfiles

- name: Sync managed directories
  ansible.posix.synchronize:
    src: "HOME/{{ item }}/"
    dest: "{{ ansible_facts.env.HOME }}/{{ item }}/"
    delete: true
    rsync_opts:
      - "--exclude=.managed-by-ansible"
  loop: "{{ mac_dev_playbook_managed_dirs }}"
  tags:
    - dotfiles

- name: Copy dotfiles to $HOME
  ansible.builtin.copy:
    src: "HOME/"
    dest: "{{ ansible_facts.env.HOME }}/"
    mode: preserve
  tags:
    - dotfiles

- name: Find zsh config fragments
  ansible.builtin.find:
    paths: "{{ ansible_facts.env.HOME }}/.zshrc.d"
    patterns: "*.zsh"
    recurse: true
  register: mac_dev_playbook_zsh_fragments
  tags:
    - dotfiles

- name: Ensure zsh config fragments are executable
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0755"
  loop: "{{ mac_dev_playbook_zsh_fragments.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - dotfiles

- name: Copy Ghostty config (macOS)
  ansible.builtin.copy:
    src: dotfiles/ghostty/config.darwin
    dest: "{{ ansible_facts.env.HOME }}/Library/Application Support/com.mitchellh.ghostty/config"
    mode: preserve
  when: ansible_facts['os_family'] == 'Darwin'
  tags:
    - dotfiles

- name: Copy Ghostty config (Ubuntu)
  ansible.builtin.copy:
    src: dotfiles/ghostty/config.linux
    dest: "{{ ansible_facts.env.HOME }}/.config/ghostty/config"
    mode: preserve
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - dotfiles

- name: Copy OS-specific ssh config include (macOS)
  ansible.builtin.copy:
    src: dotfiles/ssh-config-os/darwin.sshconfig
    dest: "{{ ansible_facts.env.HOME }}/.ssh/config.os"
    mode: "0600"
  when: ansible_facts['os_family'] == 'Darwin'
  tags:
    - dotfiles

- name: Copy OS-specific ssh config include (Ubuntu)
  ansible.builtin.copy:
    src: dotfiles/ssh-config-os/linux.sshconfig
    dest: "{{ ansible_facts.env.HOME }}/.ssh/config.os"
    mode: "0600"
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - dotfiles

- name: Copy OS-specific gitconfig include (macOS)
  ansible.builtin.copy:
    src: dotfiles/gitconfig-os/darwin.gitconfig
    dest: "{{ ansible_facts.env.HOME }}/.gitconfig.os"
    mode: preserve
  when: ansible_facts['os_family'] == 'Darwin'
  tags:
    - dotfiles

- name: Copy OS-specific gitconfig include (Ubuntu)
  ansible.builtin.copy:
    src: dotfiles/gitconfig-os/linux.gitconfig
    dest: "{{ ansible_facts.env.HOME }}/.gitconfig.os"
    mode: preserve
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - dotfiles

# Populates ~/.ssh/allowed_signers for `git log --show-signature` / SSH commit
# signing verification. Soft-fails on a fresh machine where user.email or the
# SSH key aren't set up yet -- re-run the playbook once they are.
- name: Get git commit email
  ansible.builtin.command: git config --global user.email
  register: mac_dev_playbook_git_email
  changed_when: false
  failed_when: false
  tags:
    - dotfiles

- name: Read SSH public key used for commit signing
  ansible.builtin.slurp:
    src: "{{ ansible_facts.env.HOME }}/.ssh/id_ed25519.pub"
  register: mac_dev_playbook_ssh_pubkey
  failed_when: false
  tags:
    - dotfiles

- name: Populate allowed_signers for SSH commit signature verification
  ansible.builtin.copy:
    content: "{{ mac_dev_playbook_git_email.stdout }} {{ (mac_dev_playbook_ssh_pubkey.content | b64decode).strip() }}\n"
    dest: "{{ ansible_facts.env.HOME }}/.ssh/allowed_signers"
    mode: "0644"
  when:
    - mac_dev_playbook_git_email.rc == 0
    - mac_dev_playbook_git_email.stdout | length > 0
    - mac_dev_playbook_ssh_pubkey is succeeded
  tags:
    - dotfiles
