---

mac_dev_playbook_homebrew_taps:
  - wagoodman/dive
  - hashicorp/tap
  - shaharia-lab/tap

mac_dev_playbook_homebrew_absent_packages:
  - asdf
  - tfenv
  - kubernetes-cli
  - conftest
  - hub
  - krew
  - antigen                 # replaced by brew zsh-* plugins + oh-my-zsh
  - pre-commit              # pre-commit is a git pre-commit hook framework, install it from mise instead
  - jira-cli                # replaced by acli (Atlassian's own CLI)

# Formulae installed on every OS (macOS + Ubuntu via Linuxbrew).
mac_dev_playbook_homebrew_installed_packages_common:
  # - ansible # Installed via Pip.
  - adr-tools                # adr-tools is a command line tool for working with Architecture Decision Records
  - agg                     # Asciicast to GIF converter
  - argocd                  # argocd is the CLI for Argo CD (GitOps CD for Kubernetes)
  - atuin                   # atuin is a modern history command
  - awscli                  # awscli is a command-line interface for AWS
  - bash                    # bash is a shell
  - bat                     # cat with wings
  - cargo-dist              # cargo-dist is a tool to build and distribute Rust binaries
  - copilot-cli             # GitHub Copilot CLI
  - btop                    # btop is a modern resource monitor (replaces htop)
  - dive                    # Tools to explore docker layers with an UI create, deploy, and run applications by using containers
  - docker-buildx           # Docker Buildx is a CLI plugin that extends the docker command
                            # with the full support of the features provided by Moby BuildKit builder toolkit
  - docker-compose          # Docker Compose is a tool for defining and running multi-container Docker applications
  - docker-credential-helper # Docker Credential Helper
  - fd                      # fd is a modern find replacement
  - fzf                     # fzf is a command-line fuzzy finder
  - git                     # Git is a version control system
  - git-lfs                 # Git LFS is a Git extension for versioning large files
  - gh            # GitHub CLI
  - glab                    # GitLab CLI
  - highlight               # Syntax highlighting for your terminal
  - hashicorp/tap/vault     # Vault is a tool for managing secrets
  - jq                      # jq is a lightweight and flexible command-line JSON processor
  - k9s                     # k9s is a Kubernetes CLI
  - lazygit                 # lazygit is a terminal UI for git commands
  - lf                      # lf is a terminal file manager
  - markdownlint-cli2       # is a slightly unconventional command-line interface for markdownlint.
  - mise                    # mise is a tool to manage application versioning
  - neovim                  # neovim is a modern vim-based text editor, used for quick edits
  - node                    # Node.js is a JavaScript runtime
  - openssl                 # OpenSSL is a toolkit for implementing SSL/TLS
  - parallel                # GNU parallel is a shell tool for executing jobs in parallel
  - pandoc                  # pandoc is a universal document converter
  - pigz                    # gzip with parallel support
  - starship                # cross-shell prompt (replaces powerlevel10k)
  - pygments                # Pygments is a generic syntax highlighter
  - ripgrep                 # ripgrep (rg) is a fast recursive grep replacement
  - rust                    # Rust is a systems programming language
  - shaharia-lab/tap/slackcli # slackcli is a command-line interface for Slack
  - tldr
  - tmux                    # tmux is a terminal multiplexer
  - tree                    # tree is a directory listing utility
  - hashicorp/tap/terraform-ls # terraform-ls is a terraform plugin for vscode
  - watch                   # watch is a command that runs a program periodically, showing output fullscreen
  - wget                    # wget is a command line downloader
  - yq                      # yq is a lightweight and flexible command-line YAML/JSON/XML processor
  - zsh                     # zsh is a shell interpreter for interactive programs and scripts
  - zsh-autosuggestions     # fish-like autosuggestions for zsh (replaces antigen bundle)
  - zsh-completions         # additional completion definitions for zsh (replaces antigen bundle)
  - zsh-syntax-highlighting # fish-like syntax highlighting for zsh (replaces antigen bundle)

# Formulae/casks only installed on macOS (no sane Linuxbrew/apt equivalent, or
# specifically a macOS integration).
mac_dev_playbook_homebrew_installed_packages_darwin_only:
  - gnu-sed                 # GNU version of sed (Linux ships GNU sed natively)
  - ghostty                 # Ghostty is a fast, lightweight terminal emulator. Homebrew-core only
                            # provides it as a macOS cask; no Linux formula, and Ghostty isn't on
                            # Flathub either. On Ubuntu it's installed instead via the
                            # mac_dev_playbook_apt_ppa_packages PPA below (see apt.yml).
  - iterm2                  # iTerm2 is a terminal replacement
  - keystore-explorer       # Keystore Explorer is a tool for managing Java keystores (installed via Flatpak on Ubuntu)
  - intellij-idea           # IntelliJ IDEA is a Java IDE (installed via Flatpak on Ubuntu)
  - visual-studio-code      # Visual Studio Code is a code editor (installed via apt on Ubuntu)
  - aws-vpn-client          # AWS Client VPN (installed via apt repo on Ubuntu)

mac_dev_playbook_homebrew_installed_packages: >-
  {{ mac_dev_playbook_homebrew_installed_packages_common
     + (mac_dev_playbook_homebrew_installed_packages_darwin_only if ansible_facts.os_family == 'Darwin' else []) }}

# apt packages, only installed on Ubuntu/Debian.
mac_dev_playbook_apt_packages:
  - build-essential         # C compiler/toolchain, needed by mise tools built from source (e.g. postgres)
  - flatpak                 # required by the community.general.flatpak module, see flatpak.yml
  - flameshot               # screenshot + annotation tool (macOS has this built in)
  - copyq                   # clipboard history manager (macOS has this built in)
  - gnome-tweaks            # GNOME desktop customization
  - gnome-shell-extension-manager # install/manage GNOME Shell extensions
  - seahorse                # GNOME keyring manager GUI, not installed by default on Ubuntu 26

# Nerd Font installed on Ubuntu so Starship's icons/symbols render in Ghostty
# (macOS installs are expected to already have one from a previous cask/manual setup).
mac_dev_playbook_nerd_font_name: JetBrainsMono

# apt-repository-backed installs (own GPG key + repo) on Ubuntu/Debian.
# signed_by accepts a URL directly: deb822_repository fetches and manages the
# keyring itself, no separate get_url/gpg dearmor step needed.
mac_dev_playbook_apt_repo_packages:
  - name: code
    description: Visual Studio Code
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components:
      - main
    architectures:
      - amd64
      - arm64
      - armhf
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  - name: rancher-desktop
    description: Rancher Desktop
    uris: https://download.opensuse.org/repositories/isv:/Rancher:/stable/deb/
    suites: "./"                # flat repo, no components
    signed_by: https://download.opensuse.org/repositories/isv:/Rancher:/stable/deb/Release.key
  - name: ghostty
    description: "Ghostty terminal (mkasberg/ghostty-ubuntu PPA)"
    uris: https://ppa.launchpadcontent.net/mkasberg/ghostty-ubuntu/ubuntu/
    suites: "{{ ansible_facts.distribution_release }}"
    components:
      - main
    # HTTPS keyserver lookup instead of the legacy hkp:// protocol
    # ansible.builtin.apt_repository's ppa: resolution uses (port 80/11371,
    # often filtered/unreliable) -- same fingerprint, resolved via Launchpad's
    # own API, just fetched over a transport that actually works.
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x0721FDF5FECB88DC6920361657C8EF455CEAE491"
  - name: acli
    description: "Atlassian CLI"
    uris: https://acli.atlassian.com/linux/deb
    suites: stable
    components:
      - main
    signed_by: https://acli.atlassian.com/gpg/public-key.asc
  - name: awsvpnclient
    description: "AWS Client VPN"
    # Official install instructions (CloudFront-hosted, no vanity AWS domain):
    # https://docs.aws.amazon.com/vpn/latest/clientvpn-user/client-vpn-connect-linux-install.html
    uris: https://d20adtppz83p9s.cloudfront.net/GTK/latest/debian-repo
    suites: ubuntu
    components:
      - main
    architectures:
      - amd64
    signed_by: https://d20adtppz83p9s.cloudfront.net/GTK/latest/debian-repo/awsvpnclient_public_key.asc

# Flatpak (Flathub) installs, only on Ubuntu/Debian. IntelliJ IDEA is an
# unofficial community package on Flathub (not published by JetBrains).
mac_dev_playbook_flatpak_packages:
  - com.google.Chrome
  - com.jetbrains.IntelliJ-IDEA-Ultimate
  - org.keystore_explorer.KeyStoreExplorer

mac_dev_playbook_gh_cli_extensions:
  - mislav/gh-branch        # GitHub CLI extension for managing branches
  - dlvhdr/gh-dash          # GitHub CLI extension for dashboards
  - meiji163/gh-notify      # GitHub CLI extension for notifications
